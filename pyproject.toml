[project]
name = "lunariscasino"
version = "0.1.0"
description = "Daily Telegram message forwarder with delayed sequencing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "loguru>=0.7.3",
    "python-dotenv>=1.0.1",
    "kurigram>=2.2.24",
    "motor>=3.6.0",
]

[project.optional-dependencies]
speedups = [
    "tgcrypto>=1.2.5",
]

[project.scripts]
lunariscasino = "main:main"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
preview = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "utils", "service", "schemas", "logger", "repository"]
